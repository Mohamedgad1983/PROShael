name: Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: alshuail-backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd alshuail-backend
        npm ci

    - name: Create Environment File
      run: |
        cd alshuail-backend
        cat > .env << EOF
        PORT=5001
        NODE_ENV=test
        JWT_SECRET=${{ secrets.JWT_SECRET || 'test-jwt-secret-key-for-ci' }}
        CSRF_SECRET=${{ secrets.CSRF_SECRET || 'test-csrf-secret-key-for-ci' }}
        DB_HOST=localhost
        DB_PORT=5432
        DB_NAME=alshuail_db
        DB_USER=alshuail
        EOF

    - name: Run Tests with Coverage
      run: |
        cd alshuail-backend
        npm run test:ci
      env:
        NODE_ENV: test

    - name: Generate Coverage Report
      if: always()
      run: |
        cd alshuail-backend
        echo "## 📊 Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        cat coverage/coverage-summary.json | node -e "
          const data = JSON.parse(require('fs').readFileSync(0, 'utf-8'));
          const total = data.total;
          console.log('Coverage Summary:');
          console.log('Lines:      ' + total.lines.pct + '%');
          console.log('Statements: ' + total.statements.pct + '%');
          console.log('Functions:  ' + total.functions.pct + '%');
          console.log('Branches:   ' + total.branches.pct + '%');
        " >> $GITHUB_STEP_SUMMARY || echo "Coverage summary not available" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Coverage Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          alshuail-backend/coverage/
          !alshuail-backend/coverage/**/*.js
        retention-days: 30

    - name: Upload Coverage to Codecov (Optional)
      if: always()
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: alshuail-backend/coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: alshuail-backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd alshuail-backend
        npm ci

    - name: Run ESLint
      run: |
        cd alshuail-backend
        npm run lint

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: alshuail-backend/package-lock.json

    - name: Install Dependencies
      run: |
        cd alshuail-backend
        npm ci

    - name: Build Application
      run: |
        cd alshuail-backend
        echo "Build successful - no compilation needed for Node.js"

  deploy-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Check Deployment Files
      run: |
        echo "✅ Checking deployment files..."
        if [ -f "alshuail-backend/package.json" ]; then
          echo "✅ package.json found"
        fi
        if [ -f "alshuail-backend/server.js" ]; then
          echo "✅ server.js found"
        fi
        echo "✅ Deployment check complete"

    - name: Summary
      run: |
        echo "### 🎉 All Checks Passed!" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Tests: All passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Lint: Code quality verified" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Build: Application ready" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Deploy: Ready for deployment" >> $GITHUB_STEP_SUMMARY

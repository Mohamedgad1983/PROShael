name: Deploy Backend to VPS

# Manual, opt-in deploy of the Express backend to the production VPS.
#
# PREREQUISITES (one-time):
#   1. Add repository secrets: VPS_SSH_KEY (private key), VPS_HOST, VPS_USER.
#   2. Reconcile the VPS git history with origin/main. Production currently
#      carries local-only commits, so `git pull --ff-only` (used below) will
#      FAIL until the VPS branch fast-forwards cleanly from origin/main. This
#      is intentional: a failed deploy is safer than a silent merge or an
#      overwrite of production-only state.
#
# Trigger it from the Actions tab (workflow_dispatch). It never runs on push.

on:
  workflow_dispatch:
    inputs:
      restart_only:
        description: 'Skip git pull / npm install and only restart pm2'
        type: boolean
        default: false

concurrency:
  group: deploy-backend-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RESTART_ONLY: ${{ inputs.restart_only }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ]; then
            echo "::error::Missing secrets. Add VPS_SSH_KEY, VPS_HOST and VPS_USER in repo settings."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "RESTART_ONLY='${RESTART_ONLY}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/PROShael
          if [ "${RESTART_ONLY}" != "true" ]; then
            git fetch origin
            # --ff-only: fail loudly if the VPS history has diverged instead of
            # creating a merge commit or clobbering production-only state.
            git pull --ff-only origin main
            cd alshuail-backend
            npm install --omit=dev --no-audit --no-fund
          else
            cd alshuail-backend
          fi
          pm2 restart alshuail-backend --update-env
          sleep 3
          if curl -fsS http://localhost:5001/api/health >/dev/null; then
            echo "Deploy OK: backend healthy"
          else
            echo "::error::Health check failed after restart"
            exit 1
          fi
          REMOTE
